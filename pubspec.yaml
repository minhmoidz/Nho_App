name: nhoapp
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_dotenv: ^5.1.0

  # --- UI & Icons ---
  cupertino_icons: ^1.0.8
  velocity_x: ^4.2.1
  fluttericon: ^2.0.0
  flutter_spinkit: ^5.2.1

  # --- Chat ---
  dash_chat_2: ^0.0.21

  # --- AI & Gemini ---
  google_generative_ai: ^0.4.0

  # --- Network & API ---
  http: ^1.1.0
  cached_network_image: ^3.4.1
  http_parser: ^4.0.2
  mime: ^1.0.5

  # --- Storage & Auth ---
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.3.2

  # --- Utilities ---
  path_provider: ^2.0.15
  intl: ^0.20.2
  permission_handler: ^11.3.1
  adb: ^0.3.0
  provider: ^6.1.2

  # --- Voice & TTS ---
  speech_to_text: ^7.0.0
  flutter_tts: ^3.1.0

  # --- Camera & Media ---
  camera: ^0.10.6
  image_picker: ^1.1.2

  # --- Notifications ---
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  file_picker: ^8.1.4
  audioplayers: ^5.2.1
  url_launcher: ^6.3.2
  image_cropper: ^8.0.2
  avatar_glow: ^3.0.1
  fl_chart: ^0.66.0
  geolocator: ^10.1.0   # Lấy vị trí GPS
  share_plus: ^7.2.1
  youtube_player_flutter: ^9.0.1
  webview_flutter: ^4.4.2
  flutter_timezone: ^3.0.1
  convert: ^3.1.1
  google_mlkit_pose_detection: ^0.13.0
  introduction_screen: ^3.1.12
  package_info_plus: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true

  assets:
    - images/nhoapp.png
    - images/ava.png
    - images/logo-remove-bg.png
    - images/icon.png
    - .env
    - assets/images/plank.gif
    - assets/images/pushup.gif
    - assets/images/squat.gif
    - assets/images/jumping.gif

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.otf
          weight: 800
        - asset: assets/fonts/Montserrat-Regular.otf
          weight: 400

flutter_icons:
  android: true
  ios: true
  image_path: "images/ava.png"